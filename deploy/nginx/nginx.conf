events {}
http {
  server {
    listen 443 ssl;
    server_name api.meridian-clearing.example;
    ssl_certificate     /etc/ssl/meridian/api.crt;
    ssl_certificate_key /etc/ssl/meridian/api.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA;
    location / { proxy_pass http://127.0.0.1:8080; }
  }
}
