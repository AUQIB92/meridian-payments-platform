global
    log stdout format raw local0
    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.0 ssl-max-ver TLSv1.2

frontend partners
    bind :8443 ssl crt /etc/haproxy/partners.pem
    default_backend gateway

backend gateway
    server gw1 10.0.2.10:8443 ssl verify required ca-file /etc/haproxy/ca.pem
